[project]
name = "aldwin"
version = "0.0.1.dev0"
description = "An open-source personal assistant that runs on your own computer, built on Agentling."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Folarin Akinloye", email = "me@folarin.dev" }
]
keywords = ["aldwin", "agentling", "assistant", "cli", "agents", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "agentling>=0.1,<0.2",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "trafilatura>=2.0.0",
]

[project.urls]
Homepage = "https://askaldwin.com"
Repository = "https://github.com/lunarstack-co/aldwin"
Issues = "https://github.com/lunarstack-co/aldwin/issues"

[project.scripts]
aldwin = "aldwin.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aldwin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real OpenAI API (run by hand)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "tests"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["trafilatura.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "types-PyYAML>=6.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]
